<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Health Insurance | AJ KALAI ASSOCIATES</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<section class="form-page">

    <div class="form-container">

        <a href="index.html" class="back-link">
            ← Back to Services
        </a>

        <h1>🏥 Health Insurance</h1>

        <p class="subtitle">
            Enter your family details to enquire about health insurance.
        </p>

        <div id="successMessage" class="success-message"></div>

        <form class="service-form" data-service="health">

            <div class="form-group">
                <label for="name">Name</label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your name"
                    required
                >
            </div>


            <div class="form-group">

                <label for="gender">
                    Self - Gender
                </label>

                <select
                    id="gender"
                    name="gender"
                    required
                >
                    <option value="">
                        Select Gender
                    </option>

                    <option value="Male">
                        Male
                    </option>

                    <option value="Female">
                        Female
                    </option>
                </select>

            </div>


            <div class="form-group">

                <label for="selfDob">
                    Self - Date of Birth
                </label>

                <input
                    type="date"
                    id="selfDob"
                    name="selfDob"
                    required
                >

            </div>


            <div class="form-group">

                <label for="spouseDob">
                    Spouse - Date of Birth
                </label>

                <input
                    type="date"
                    id="spouseDob"
                    name="spouseDob"
                >

            </div>


            <div class="form-group">

                <label for="sonCount">
                    Number of Sons
                </label>

                <select
                    id="sonCount"
                    name="sonCount"
                >
                    <option value="0">0</option>
                    <option value="1">1</option>
                    <option value="2">2</option>
                </select>

            </div>


            <div id="sonFields" class="dynamic-fields"></div>


            <div class="form-group">

                <label for="daughterCount">
                    Number of Daughters
                </label>

                <select
                    id="daughterCount"
                    name="daughterCount"
                >
                    <option value="0">0</option>
                    <option value="1">1</option>
                    <option value="2">2</option>
                </select>

            </div>


            <div id="daughterFields" class="dynamic-fields"></div>


            <div class="form-group">

                <label for="pincode">
                    Pincode
                </label>

                <input
                    type="text"
                    id="pincode"
                    name="pincode"
                    maxlength="6"
                    inputmode="numeric"
                    placeholder="Enter 6-digit pincode"
                    required
                >

            </div>


            <div class="form-group">

                <label for="mobile">
                    Mobile Number
                </label>

                <input
                    type="tel"
                    id="mobile"
                    name="mobile"
                    maxlength="10"
                    inputmode="numeric"
                    placeholder="Enter 10-digit mobile number"
                    required
                >

            </div>


            <button
                type="submit"
                class="submit-btn"
            >
                Submit Health Enquiry
            </button>

        </form>

    </div>

</section>

<script src="script.js"></script>

</body>
</html>
